<!DOCTYPE html>

  <style>
    .nf { display: grid; place-items: center; min-height: 100vh; padding: 24px; text-align: center; }

  <div class="atmo" aria-hidden="true"><div class="atmo__layer is-active" data-for="dusk"></div></div>

      <p class="nf__actions">

        <a class="btn" href="/projeler.html"><span data-lang="tr">Projeler</span><span data-lang="en">Projects</span></a>
      </p>
    </div>
