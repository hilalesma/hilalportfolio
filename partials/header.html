<!-- Sabit atmosfer katmanları: bölüm değiştikçe biri görünür olur (js/site.js) -->
<div class="atmo" aria-hidden="true">
  <div class="atmo__layer" data-for="night"></div>
  <div class="atmo__layer" data-for="paper"></div>
  <div class="atmo__layer" data-for="pearl"></div>
  <div class="atmo__layer" data-for="blush"></div>
  <div class="atmo__layer" data-for="sand"></div>
  <div class="atmo__layer" data-for="dusk"></div>
</div>

<!-- En alt arka plan katmanı (z-index:-2): çok yavaş çapraz süzülen üç bulanık ışık küresi
     (lavanta, koyu mor, şampanya). Çiçek ve yıldızların arkasında kalır (css/ambient.css). -->
<div class="ambient-orbs" aria-hidden="true">
  <span class="ambient-orb ambient-orb--lavender"></span>
  <span class="ambient-orb ambient-orb--violet"></span>
  <span class="ambient-orb ambient-orb--champagne"></span>
</div>

<!-- Açık bölümlerin arka plan derinliği (tüm sayfalar): sıcak mesh gradient, mimari ızgara,
     kâğıt greni, kaydırdıkça süzülen silik çiçek/yıldız motifleri ve imleci izleyen sıcak ışık.
     Hepsi z-index:-1 ve pointer-events:none; metinlerin yerleşimine dokunmaz (css/ambient.css, js/ambient.js). -->
<div class="ambient" aria-hidden="true">
  <div class="ambient__mesh"></div>
  <div class="ambient__grid"></div>
  <div class="ambient__grain"></div>
  <div class="ambient__motifs" data-ambient-motifs></div>
  <!-- her 10 sn'de bir sağ üstten sol alta geçen ince altın/beyaz kayan yıldız -->
  <span class="ambient__shooting"></span>
  <div class="ambient__glow" data-ambient-glow></div>
</div>
